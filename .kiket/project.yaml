model_version: "1.0"
project:
  key: KANBAN
  name: Kanban Development
  version: 1.0.0
  description: Lightweight kanban workflow for continuous software delivery.

  team:
    roles:
      - name: developer
        description: Software developer working on features and fixes
      - name: reviewer
        description: Engineer performing code reviews and QA
      - name: lead
        description: Team lead managing priorities and flow

  extensions:
    required:
      - github
    optional:
      - slack

  seed_data:
    issues:
      - title: Migrate user sessions to Redis-backed store
        description: Current in-memory sessions don't survive deploys. Switch to Redis to support zero-downtime deployments.
        case_type: UserStory
        status: in_progress
        priority: high
        labels:
          - infrastructure
          - reliability

      - title: Fix timezone offset in activity feed timestamps
        description: Users in UTC-negative timezones see future-dated entries in their activity feed.
        case_type: Bug
        status: review
        priority: medium
        labels:
          - bug
          - frontend

      - title: Add bulk archive action to project list
        description: Allow users to select multiple projects and archive them in one operation from the dashboard.
        case_type: UserStory
        status: backlog
        priority: low
        labels:
          - ux
          - dashboard

      - title: Evaluate OpenTelemetry collector for trace aggregation
        description: Current tracing setup sends directly to Cloud Trace. Investigate whether an OTel collector improves batching and reduces costs.
        case_type: Task
        status: backlog
        priority: medium
        labels:
          - observability
          - infrastructure

      - title: Implement webhook retry with exponential backoff
        description: Failed webhook deliveries are currently dropped. Add a retry queue with exponential backoff and dead-letter logging.
        case_type: UserStory
        status: in_progress
        priority: high
        labels:
          - integrations
          - reliability

      - title: Dashboard charts render blank on Safari 16
        description: The analytics dashboard charts fail to render on Safari 16 due to a ResizeObserver loop error.
        case_type: Bug
        status: review
        priority: critical
        labels:
          - bug
          - browser-compat
